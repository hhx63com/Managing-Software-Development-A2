

<!DOCTYPE html>
<html lang="en">
<head>
 <meta charset="UTF-8">
 <meta name="viewport" content="width=device-width, initial-scale=1.0">
 <title>Tank Battle</title>
 <style>
 * {
 margin: 0;
 padding: 0;
 box-sizing: border-box;
 }
 body {
 display: flex;
 justify-content: center;
 align-items: center;
 min-height: 100vh;
 background: linear-gradient(to bottom, #1a1a2e, #16213e);
 font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
 color: #fff;
 overflow: hidden;
 }
 .game-container {
 display: flex;
 flex-direction: column;
 align-items: center;
 gap: 20px;
 padding: 20px;
 }
 .game-header {
 text-align: center;
 margin-bottom: 10px;
 }
 .game-header h1 {
 font-size: 42px;
 margin-bottom: 5px;
 text-shadow: 0 0 10px #00b4d8;
 color: #e63946;
 }
 .game-header p {
 font-size: 18px;
 color: #a8dadc;
 }
 .stats {
 display: flex;
 justify-content: space-between;
 width: 800px;
 background: rgba(0, 0, 0, 0.5);
 padding: 10px 20px;
 border-radius: 10px;
 margin-bottom: 10px;
 }
 .stats div {
 font-size: 20px;
 }
 #gameCanvas {
 border: 3px solid #e63946;
 border-radius: 5px;
 background-color: #000;
 box-shadow: 0 0 20px rgba(230, 57, 70, 0.5);
 }
 .controls {
 background: rgba(0, 0, 0, 0.5);
 padding: 15px;
 border-radius: 10px;
 width: 800px;
 margin-top: 10px;
 }
 .controls h3 {
 color: #e63946;
 margin-bottom: 10px;
 text-align: center;
 }
 .controls p {
 margin: 5px 0;
 color: #a8dadc;
 }
 .key {
 display: inline-block;
 background: #333;
 padding: 2px 8px;
 border-radius: 4px;
 margin: 0 2px;
 font-weight: bold;
 }
 .restart-btn {
 background: #e63946;
 color: white;
 border: none;
 padding: 10px 20px;
 font-size: 18px;
 border-radius: 5px;
 cursor: pointer;
 margin-top: 10px;
 transition: background 0.3s;
 }
 .restart-btn:hover {
 background: #f8515c;
 }
 .game-over {
 position: absolute;
 top: 50%;
 left: 50%;
 transform: translate(-50%, -50%);
 background: rgba(0, 0, 0, 0.8);
 padding: 30px;
 border-radius: 10px;
 text-align: center;
 display: none;
 }
 .game-over h2 {
 color: #e63946;
 font-size: 36px;
 margin-bottom: 20px;
 }
 .tank-icon {
 display: inline-block;
 width: 20px;
 height: 20px;
 background: #4CAF50;
 margin-right: 5px;
 border-radius: 3px;
 }
 /* Pause message */
 #pauseMessage {
 display: none;
 position: absolute;
 top: 50%;
 left: 50%;
 transform: translate(-50%, -50%);
 background-color: rgba(0,0,0,0.8);
 color: white;
 padding: 20px;
 border-radius: 10px;
 text-align: center;
 }
 </style>
</head>
<body>
 <div class="game-container">
 <div class="game-header">
 <h1>Tank Battle</h1>
 <p>Destroy all enemy tanks, protect the base!</p>
 </div>
 
 <div class="stats">
 <div>Score: <span id="score">0</span></div>
 <div>Lives: <span id="lives">3</span></div>
 <div>Enemies: <span id="enemies">10</span></div>
 <div>Level: <span id="level">1</span></div>
 </div>
 
 <canvas id="gameCanvas" width="800" height="600"></canvas>
 
 <div class="controls">
 <h3>Game Controls</h3>
 <p>Movement: <span class="key">W</span> <span class="key">A</span> <span class="key">S</span> <span class="key">D</span></p>
 <p>Fire: <span class="key">Space</span></p>
 <p>Pause: <span class="key">P</span></p>
 <button class="restart-btn" onclick="restartGame()">Restart</button>
 </div>
 </div>
 
 <div id="gameOver" class="game-over">
 <h2 id="gameOverText">Game Over</h2>
 <p>Your final score: <span id="finalScore">0</span></p>
 <button class="restart-btn" onclick="restartGame()">Play Again</button>
 </div>
 
 <!-- Pause message element -->
 <div id="pauseMessage">Game Paused</div>
 
 <script>
 // Get canvas and context
 const canvas = document.getElementById('gameCanvas');
 const ctx = canvas.getContext('2d');
 const scoreElement = document.getElementById('score');
 const livesElement = document.getElementById('lives');
 const enemiesElement = document.getElementById('enemies');
 const levelElement = document.getElementById('level');
 const gameOverElement = document.getElementById('gameOver');
 const gameOverTextElement = document.getElementById('gameOverText');
 const finalScoreElement = document.getElementById('finalScore');
 
 // Game state
 let gameState = {
 score: 0,
 lives: 3,
 enemies: 10,
 level: 1,
 gameOver: false,
 paused: false
 };
 
 // Player tank
 const player = {
 x: 400,
 y: 550,
 width: 40,
 height: 40,
 speed: 5,
 direction: 0, // 0: up, 1: right, 2: down, 3: left
 color: '#4CAF50',
 fireRate: 500, // firing interval (ms)
 lastFire: 0,
 active: true
 };
 
 // Bullet array
 let bullets = [];
 
 // Enemy tank array
 let enemyTanks = [];
 
 // Obstacle array
 let obstacles = [];
 
 // Base
 const base = {
 x: 380,
 y: 560,
 width: 40,
 height: 40,
 color: '#FFD700'
 };
 
 // Key states
 const keys = {
 w: false,
 a: false,
 s: false,
 d: false,
 space: false
 };
 
 // Initialize game
 function initGame() {
 // Reset game state
 gameState.score = 0;
 gameState.lives = 3;
 gameState.enemies = 10;
 gameState.level = 1;
 gameState.gameOver = false;
 gameState.paused = false;
 
 // Clear arrays
 bullets = [];
 enemyTanks = [];
 obstacles = [];
 
 // Reset player
 player.x = 400;
 player.y = 550;
 player.direction = 0;
 player.active = true;
 
 // Create obstacles
 createObstacles();
 
 // Create initial enemy tanks
 createEnemyTanks(3);
 
 // Update UI
 updateUI();
 
 // Hide game over screen
 gameOverElement.style.display = 'none';
 
 // Start game loop
 requestAnimationFrame(gameLoop);
 }
 
 // Create obstacles
 function createObstacles() {
 // Boundary walls
 for (let i = 0; i < canvas.width; i += 20) {
 obstacles.push({x: i, y: 0, width: 20, height: 20, type: 'steel'}); // top boundary
 obstacles.push({x: i, y: canvas.height - 20, width: 20, height: 20, type: 'steel'}); // bottom boundary
 }
 
 for (let i = 20; i < canvas.height - 20; i += 20) {
 obstacles.push({x: 0, y: i, width: 20, height: 20, type: 'steel'}); // left boundary
 obstacles.push({x: canvas.width - 20, y: i, width: 20, height: 20, type: 'steel'}); // right boundary
 }
 
 // Random brick walls
 for (let i = 0; i < 20; i++) {
 const x = Math.floor(Math.random() * 38) * 20 + 20;
 const y = Math.floor(Math.random() * 28) * 20 + 20;
 // Ensure not generated on player or base
 if (!isColliding({x, y, width: 20, height: 20}, player) &&
 !isColliding({x, y, width: 20, height: 20}, base)) {
 obstacles.push({x, y, width: 20, height: 20, type: 'brick'});
 }
 }
 
 // Walls protecting the base
 for (let i = 0; i < 3; i++) {
 obstacles.push({x: base.x - 20, y: base.y + i * 20, width: 20, height: 20, type: 'steel'});
 obstacles.push({x: base.x + 40, y: base.y + i * 20, width: 20, height: 20, type: 'steel'});
 obstacles.push({x: base.x + i * 20, y: base.y - 20, width: 20, height: 20, type: 'steel'});
 }
 }
 
 // Create enemy tanks
 function createEnemyTanks(count) {
 const spawnPoints = [
 {x: 100, y: 100},
 {x: 400, y: 100},
 {x: 700, y: 100},
 {x: 200, y: 100},
 {x: 600, y: 100}
 ];
 
 let tanksCreated = 0;
 while (tanksCreated < count && gameState.enemies > 0 && enemyTanks.length < 5) {
 const point = spawnPoints[Math.floor(Math.random() * spawnPoints.length)];
 enemyTanks.push({
 x: point.x,
 y: point.y,
 width: 40,
 height: 40,
 speed: 2,
 direction: 2, // down
 color: '#e63946',
 fireRate: 1500,
 lastFire: 0,
 active: true
 });
 gameState.enemies--;
 tanksCreated++;
 }
 updateUI();
 }
 
 // Game main loop
 function gameLoop() {
 if (gameState.gameOver) {
 return;
 }
 
 if (gameState.paused) {
 document.getElementById('pauseMessage').style.display = 'block';
 requestAnimationFrame(gameLoop);
 return;
 } else {
 document.getElementById('pauseMessage').style.display = 'none';
 }
 
 // Clear canvas
 ctx.clearRect(0, 0, canvas.width, canvas.height);
 
 // Draw background
 drawBackground();
 
 // Update and draw game objects
 updatePlayer();
 updateBullets();
 updateEnemies();
 
 // Draw base
 drawBase();
 
 // Draw obstacles
 drawObstacles();
 
 // Check game state
 checkGameState();
 
 // Continue game loop
 requestAnimationFrame(gameLoop);
 }
 
 // Draw background
 function drawBackground() {
 ctx.fillStyle = '#000';
 ctx.fillRect(0, 0, canvas.width, canvas.height);
 
 // Draw grid
 ctx.strokeStyle = '#1a1a2e';
 ctx.lineWidth = 1;
 for (let x = 0; x < canvas.width; x += 40) {
 ctx.beginPath();
 ctx.moveTo(x, 0);
 ctx.lineTo(x, canvas.height);
 ctx.stroke();
 }
 for (let y = 0; y < canvas.height; y += 40) {
 ctx.beginPath();
 ctx.moveTo(0, y);
 ctx.lineTo(canvas.width, y);
 ctx.stroke();
 }
 }
 
 // Update player
 function updatePlayer() {
 if (!player.active) return;
 
 // Handle player movement
 handlePlayerMovement();
 
 // Handle player firing
 if (keys.space) {
 const now = Date.now();
 if (now - player.lastFire > player.fireRate) {
 fireBullet(player, 'player');
 player.lastFire = now;
 }
 }
 
 // Draw player tank
 drawTank(player.x, player.y, player.width, player.height, player.direction, player.color);
 }
 
 // Handle player movement
 function handlePlayerMovement() {
 let newX = player.x;
 let newY = player.y;
 
 if (keys.w) {
 player.direction = 0;
 newY -= player.speed;
 }
 if (keys.s) {
 player.direction = 2;
 newY += player.speed;
 }
 if (keys.a) {
 player.direction = 3;
 newX -= player.speed;
 }
 if (keys.d) {
 player.direction = 1;
 newX += player.speed;
 }
 
 // Boundary check
 if (newX < 20) newX = 20;
 if (newX > canvas.width - player.width - 20) newX = canvas.width - player.width - 20;
 if (newY < 20) newY = 20;
 if (newY > canvas.height - player.height - 20) newY = canvas.height - player.height - 20;
 
 // Create temporary player object for collision detection
 const tempPlayer = {
 x: newX,
 y: newY,
 width: player.width,
 height: player.height
 };
 
 // Check collision with obstacles
 let canMove = true;
 for (const obstacle of obstacles) {
 if (isColliding(tempPlayer, obstacle)) {
 canMove = false;
 break;
 }
 }
 
 // Check collision with enemy tanks
 for (const enemy of enemyTanks) {
 if (enemy.active && isColliding(tempPlayer, enemy)) {
 canMove = false;
 break;
 }
 }
 
 // Check collision with base
 if (isColliding(tempPlayer, base)) {
 canMove = false;
 }
 
 // If can move, update player position
 if (canMove) {
 player.x = newX;
 player.y = newY;
 }
 }
 
 // Update bullets
 function updateBullets() {
 for (let i = bullets.length - 1; i >= 0; i--) {
 const bullet = bullets[i];
 
 // Move bullet
 switch (bullet.direction) {
 case 0: bullet.y -= 10; break; // up
 case 1: bullet.x += 10; break; // right
 case 2: bullet.y += 10; break; // down
 case 3: bullet.x -= 10; break; // left
 }
 
 // Check if bullet is out of bounds
 if (bullet.x < 0 || bullet.x > canvas.width || bullet.y < 0 || bullet.y > canvas.height) {
 bullets.splice(i, 1);
 continue;
 }
 
 // Check bullet collision with obstacles
 let hitObstacle = false;
 for (let j = obstacles.length - 1; j >= 0 && !hitObstacle; j--) {
 const obstacle = obstacles[j];
 if (isColliding(bullet, obstacle)) {
 if (obstacle.type === 'brick') {
 obstacles.splice(j, 1);
 }
 bullets.splice(i, 1);
 hitObstacle = true;
 break;
 }
 }
 
 if (hitObstacle) continue;
 
 // Check bullet collision with tanks
 if (bullet.owner === 'player') {
 // Player bullet collision with enemy tanks
 for (let j = enemyTanks.length - 1; j >= 0; j--) {
 const enemy = enemyTanks[j];
 if (enemy.active && isColliding(bullet, enemy)) {
 enemy.active = false;
 enemyTanks.splice(j, 1);
 bullets.splice(i, 1);
 gameState.score += 100;
 updateUI();
 break;
 }
 }
 } else {
 // Enemy bullet collision with player tank
 if (player.active && isColliding(bullet, player)) {
 player.active = false;
 bullets.splice(i, 1);
 gameState.lives--;
 updateUI();
 
 // Respawn player
 if (gameState.lives > 0) {
 setTimeout(() => {
 player.x = 400;
 player.y = 550;
 player.direction = 0;
 player.active = true;
 }, 1000);
 }
 }
 
 // Enemy bullet collision with base
 if (isColliding(bullet, base)) {
 gameState.lives = 0;
 updateUI();
 bullets.splice(i, 1);
 }
 }
 
 // Draw bullet
 if (bullets[i]) {
 ctx.fillStyle = bullet.owner === 'player' ? '#4CAF50' : '#e63946';
 ctx.beginPath();
 ctx.arc(bullet.x, bullet.y, 5, 0, Math.PI * 2);
 ctx.fill();
 }
 }
 }
 
 // Update enemies
 function updateEnemies() {
 // Create new enemies
 if (enemyTanks.length < 3 && gameState.enemies > 0) {
 if (Math.random() < 0.02) {
 createEnemyTanks(1);
 }
 }
 
 for (let i = 0; i < enemyTanks.length; i++) {
 const enemy = enemyTanks[i];
 if (!enemy.active) continue;
 
 // Randomly change direction
 if (Math.random() < 0.02) {
 enemy.direction = Math.floor(Math.random() * 4);
 }
 
 // Move enemy
 let newX = enemy.x;
 let newY = enemy.y;
 
 switch (enemy.direction) {
 case 0: newY -= enemy.speed; break; // up
 case 1: newX += enemy.speed; break; // right
 case 2: newY += enemy.speed; break; // down
 case 3: newX -= enemy.speed; break; // left
 }
 
 // Check collision
 let canMove = true;
 const tempEnemy = {x: newX, y: newY, width: enemy.width, height: enemy.height};
 
 // Collision with obstacles
 for (const obstacle of obstacles) {
 if (isColliding(tempEnemy, obstacle)) {
 canMove = false;
 enemy.direction = Math.floor(Math.random() * 4);
 break;
 }
 }
 
 // Collision with player
 if (player.active && isColliding(tempEnemy, player)) {
 canMove = false;
 enemy.direction = Math.floor(Math.random() * 4);
 }
 
 // Collision with other enemies
 for (let j = 0; j < enemyTanks.length; j++) {
 if (i !== j && enemyTanks[j].active && isColliding(tempEnemy, enemyTanks[j])) {
 canMove = false;
 enemy.direction = Math.floor(Math.random() * 4);
 break;
 }
 }
 
 // Collision with boundaries
 if (newX < 20 || newX > canvas.width - 60 || newY < 20 || newY > canvas.height - 60) {
 canMove = false;
 enemy.direction = Math.floor(Math.random() * 4);
 }
 
 if (canMove) {
 enemy.x = newX;
 enemy.y = newY;
 }
 
 // Enemy firing
 const now = Date.now();
 if (now - enemy.lastFire > enemy.fireRate && Math.random() < 0.02) {
 fireBullet(enemy, 'enemy');
 enemy.lastFire = now;
 }
 
 // Draw enemy tank
 drawTank(enemy.x, enemy.y, enemy.width, enemy.height, enemy.direction, enemy.color);
 }
 }
 
 // Draw tank
 function drawTank(x, y, width, height, direction, color) {
 ctx.save();
 ctx.translate(x + width/2, y + height/2);
 
 // Rotate based on direction
 switch (direction) {
 case 0: ctx.rotate(0); break; // up
 case 1: ctx.rotate(Math.PI/2); break; // right
 case 2: ctx.rotate(Math.PI); break; // down
 case 3: ctx.rotate(-Math.PI/2); break; // left
 }
 
 // Tank body
 ctx.fillStyle = color;
 ctx.fillRect(-width/2, -height/2, width, height);
 
 // Tank tracks
 ctx.fillStyle = '#333';
 ctx.fillRect(-width/2 - 5, -height/2, 5, height); // left track
 ctx.fillRect(width/2, -height/2, 5, height); // right track
 
 // Tank barrel
 ctx.fillStyle = '#333';
 ctx.fillRect(-3, -height/2 - 15, 6, 15);
 
 ctx.restore();
 }
 
 // Draw base
 function drawBase() {
 ctx.fillStyle = base.color;
 ctx.fillRect(base.x, base.y, base.width, base.height);
 
 // Draw base symbol
 ctx.fillStyle = '#000';
 ctx.beginPath();
 ctx.moveTo(base.x + base.width/2, base.y);
 ctx.lineTo(base.x + base.width, base.y + base.height/2);
 ctx.lineTo(base.x + base.width/2, base.y + base.height);
 ctx.lineTo(base.x, base.y + base.height/2);
 ctx.closePath();
 ctx.fill();
 }
 
 // Draw obstacles
 function drawObstacles() {
 for (const obstacle of obstacles) {
 if (obstacle.type === 'brick') {
 ctx.fillStyle = '#8B4513'; // brick color
 } else {
 ctx.fillStyle = '#666'; // steel color
 }
 ctx.fillRect(obstacle.x, obstacle.y, obstacle.width, obstacle.height);
 
 // Draw brick texture
 if (obstacle.type === 'brick') {
 ctx.strokeStyle = '#A0522D';
 ctx.lineWidth = 1;
 ctx.strokeRect(obstacle.x, obstacle.y, obstacle.width, obstacle.height);
 ctx.beginPath();
 ctx.moveTo(obstacle.x, obstacle.y + obstacle.height/2);
 ctx.lineTo(obstacle.x + obstacle.width, obstacle.y + obstacle.height/2);
 ctx.stroke();
 }
 }
 }
 
 // Fire bullet
 function fireBullet(tank, owner) {
 bullets.push({
 x: tank.x + tank.width/2,
 y: tank.y + tank.height/2,
 direction: tank.direction,
 owner: owner,
 speed: 10
 });
 }
 
 // Collision detection
 function isColliding(obj1, obj2) {
 return obj1.x < obj2.x + obj2.width &&
 obj1.x + obj1.width > obj2.x &&
 obj1.y < obj2.y + obj2.height &&
 obj1.y + obj1.height > obj2.y;
 }
 
 // Update UI
 function updateUI() {
 scoreElement.textContent = gameState.score;
 livesElement.textContent = gameState.lives;
 enemiesElement.textContent = gameState.enemies;
 levelElement.textContent = gameState.level;
 }
 
 // Check game state
 function checkGameState() {
 // Check game over
 if (gameState.lives <= 0) {
 gameState.gameOver = true;
 finalScoreElement.textContent = gameState.score;
 gameOverElement.style.display = 'block';
 return;
 }
 
 // Check level completion
 if (gameState.enemies <= 0 && enemyTanks.length === 0) {
 gameState.level++;
 gameState.enemies = 10 + gameState.level * 2;
 
 // Clear obstacles and recreate
 obstacles = [];
 createObstacles();
 
 // Show level up message
 const levelUpMessage = document.createElement('div');
 levelUpMessage.textContent = `Level ${gameState.level - 1} complete! Next level: ${gameState.level}`;
 levelUpMessage.style.position = 'absolute';
 levelUpMessage.style.top = '50%';
 levelUpMessage.style.left = '50%';
 levelUpMessage.style.transform = 'translate(-50%, -50%)';
 levelUpMessage.style.backgroundColor = 'rgba(0,0,0,0.8)';
 levelUpMessage.style.color = 'white';
 levelUpMessage.style.padding = '20px';
 levelUpMessage.style.borderRadius = '10px';
 levelUpMessage.style.textAlign = 'center';
 document.body.appendChild(levelUpMessage);
 
 // Remove message after 3 seconds
 setTimeout(() => {
 document.body.removeChild(levelUpMessage);
 }, 3000);
 
 // Create new enemy tanks
 createEnemyTanks(3);
 updateUI();
 }
 }
 
 // Restart game
 function restartGame() {
 initGame();
 }
 
 // Event listeners
 document.addEventListener('keydown', function(e) {
 if (e.key === 'w') keys.w = true;
 if (e.key === 's') keys.s = true;
 if (e.key === 'a') keys.a = true;
 if (e.key === 'd') keys.d = true;
 if (e.key === ' ') keys.space = true;
 if (e.key === 'p') gameState.paused = !gameState.paused;
 });
 
 document.addEventListener('keyup', function(e) {
 if (e.key === 'w') keys.w = false;
 if (e.key === 's') keys.s = false;
 if (e.key === 'a') keys.a = false;
 if (e.key === 'd') keys.d = false;
 if (e.key === ' ') keys.space = false;
 });
 
 // Initialize game
 initGame();
 </script>
</body>
</html>
